<style>
/* ===========================================================
   Token system
   =========================================================== */
:root {
  --bg: #ffffff;
  --bg-raised: #eeeeee;
  --line: #232327;
  --text: #000000;
  --text-muted: #000000;
  --accent: #deb902;
  --accent-dim: #F0D28D;
  --font-display: "Arial Nova", Arial, sans-serif;
  --font-body: "Lora", "Source Serif 4", Georgia, serif;
  --font-mono: "Inconsolata", "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;

  --max-width: 2400px;
  --gutter: 75px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: clamp(1rem, 0.94rem + 0.3vw, 1.125rem);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

::selection { background: var(--accent-dim); color: #fff; }

/* ===========================================================
   Layout primitives
   =========================================================== */
.wrap {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 var(--gutter);
}

/* ===========================================================
   Nav
   =========================================================== */
header.site-nav {
  border-bottom: 1px solid var(--line);
  padding: 20px 0;
}

header.site-nav .wrap {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 12px;
}

.site-name {
  font-family: var(--font-mono);
  font-size: clamp(0.8rem, 0.72rem + 0.35vw, 0.95rem);
  letter-spacing: 0.04em;
  color: var(--text);
  text-decoration: none;
}

.site-name span { color: var(--accent); }

nav.pages { display: flex; gap: 20px; }

nav.pages a {
  font-family: var(--font-mono);
  font-size: clamp(0.75rem, 0.68rem + 0.3vw, 0.85rem);
  color: var(--text-muted);
  text-decoration: none;
  letter-spacing: 0.03em;
  padding-bottom: 2px;
  border-bottom: 1px solid transparent;
}

nav.pages a:hover,
nav.pages a[aria-current="page"] {
  color: var(--text);
  border-bottom-color: var(--accent);
}

/* ===========================================================
   Hero
   =========================================================== */
.hero {
  padding: 96px 0 64px;
  position: relative;
}

.hero .eyebrow {
  font-family: var(--font-mono);
  font-size: clamp(0.75rem, 0.68rem + 0.3vw, 0.85rem);
  color: var(--accent);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin: 0 0 18px;
}

.hero h1 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.75rem, 1.3rem + 2.2vw, 2.875rem);
  line-height: 1.15;
  margin: 0 0 20px;
}

.hero p.lede {
  color: var(--text-muted);
  font-size: clamp(1rem, 0.94rem + 0.3vw, 1.1875rem);
  max-width: 54ch;
  margin: 0;
}

/* faint fixed starfield, hero only */
.starfield {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(232,230,225,0.35) 0, transparent 100%),
    radial-gradient(1px 1px at 80% 10%, rgba(232,230,225,0.25) 0, transparent 100%),
    radial-gradient(1.5px 1.5px at 60% 60%, rgba(232,230,225,0.3) 0, transparent 100%),
    radial-gradient(1px 1px at 30% 80%, rgba(232,230,225,0.2) 0, transparent 100%),
    radial-gradient(1px 1px at 92% 70%, rgba(232,230,225,0.3) 0, transparent 100%),
    radial-gradient(1px 1px at 45% 35%, rgba(232,230,225,0.2) 0, transparent 100%);
  background-repeat: no-repeat;
}

/* ===========================================================
   Sections / content
   =========================================================== */
main { padding-bottom: 80px; }

section { padding: 48px 0; border-top: 1px solid var(--line); }

section:first-of-type { border-top: none; }

section h2 {
  font-family: var(--font-mono);
  font-size: clamp(0.8rem, 0.72rem + 0.35vw, 0.95rem);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 0 0 28px;
}

.entry { margin-bottom: 32px; }
.entry:last-child { margin-bottom: 0; }

.entry .meta {
  font-family: var(--font-mono);
  font-size: clamp(0.72rem, 0.65rem + 0.3vw, 0.82rem);
  color: var(--accent);
  letter-spacing: 0.02em;
  margin: 0 0 6px;
}

.entry h3 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(1.05rem, 0.98rem + 0.35vw, 1.3125rem);
  margin: 0 0 8px;
}

.entry p {
  color: var(--text-muted);
  margin: 0;
}

.entry a.entry-link {
  color: var(--text);
  text-decoration: none;
  border-bottom: 1px solid var(--accent-dim);
}

.entry a.entry-link:hover { border-bottom-color: var(--accent); }

/* placeholder blocks: visible only while unfilled */
.placeholder {
  border: 1px dashed var(--line);
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: clamp(0.75rem, 0.68rem + 0.3vw, 0.85rem);
  padding: 14px 16px;
  border-radius: 4px;
}

/* ===========================================================
   Footer
   =========================================================== */
footer {
  border-top: 1px solid var(--line);
  padding: 32px 0;
}

footer .wrap {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

footer p {
  font-family: var(--font-mono);
  font-size: clamp(0.7rem, 0.63rem + 0.3vw, 0.8rem);
  color: var(--text-muted);
  margin: 0;
}

footer a {
  color: var(--text-muted);
  margin-right: 16px;
  text-decoration: none;
}

footer a:hover { color: var(--accent); }

/* ===========================================================
   Contact page specifics
   =========================================================== */

.contact-list li a { color: var(--text); text-decoration: none; }
.contact-list li a:hover { color: var(--accent); } */

/* ===========================================================
   Responsive
   =========================================================== */
@media (max-width: 560px) {
  .hero { padding: 64px 0 40px; }
  .hero h1 { font-size: clamp(1.5rem, 1.2rem + 1.5vw, 2.125rem); }
  nav.pages { gap: 14px; }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

/* Keyboard focus visibility */
a:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

</style>
</head>
